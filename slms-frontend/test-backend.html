<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Connection Test - SLMS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-result {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Backend Connection Test</h1>
  <div id="results"></div>
  
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    const results = document.getElementById('results');
    
    function addResult(title, status, message, data = null) {
      const div = document.createElement('div');
      div.className = `test-result ${status}`;
      div.innerHTML = `<strong>${title}:</strong> ${message}`;
      if (data) {
        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify(data, null, 2);
        div.appendChild(pre);
      }
      results.appendChild(div);
    }
    
    async function runTests() {
      addResult('Test 1', 'info', 'Testing backend connectivity...');
      
      // Test 1: Health check
      try {
        const health = await api.checkHealth();
        addResult('Test 1: Health Check', 'success', 'Backend is reachable', health);
      } catch (error) {
        addResult('Test 1: Health Check', 'error', `Failed: ${error.message}`, error);
      }
      
      // Test 2: Get books
      try {
        const books = await api.getBooks({ page: 1, page_size: 1 });
        addResult('Test 2: Get Books', 'success', `Success! Found ${books.total} books`, books);
      } catch (error) {
        addResult('Test 2: Get Books', 'error', `Failed: ${error.message}`, error);
      }
      
      // Test 3: Get pending
      try {
        const pending = await api.getPending();
        addResult('Test 3: Get Pending', 'success', `Success! Found ${pending.length} pending entries`, pending);
      } catch (error) {
        addResult('Test 3: Get Pending', 'error', `Failed: ${error.message}`, error);
      }
      
      // Test 4: Check auth token
      const token = Auth.getToken();
      const user = localStorage.getItem('user');
      addResult('Test 4: Auth Token', token ? 'success' : 'error', 
        token ? 'Token found' : 'No token found',
        { hasToken: !!token, user: user ? JSON.parse(user) : null }
      );
      
      addResult('Tests Complete', 'info', 'Check results above');
    }
    
    runTests();
  </script>
</body>
</html>
