<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login - SLMS</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      padding: var(--spacing-lg);
    }
    
    .login-card {
      background: white;
      border-radius: var(--border-radius-lg);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: var(--spacing-xl);
      width: 100%;
      max-width: 400px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }
    
    .login-header h1 {
      color: var(--primary-color);
      margin-bottom: var(--spacing-xs);
    }
    
    .login-tabs {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
      border-bottom: 2px solid var(--gray-200);
    }
    
    .login-tab {
      flex: 1;
      padding: var(--spacing-md);
      text-align: center;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--gray-600);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    
    .login-tab.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
      font-weight: 600;
    }
    
    .login-form {
      display: none;
    }
    
    .login-form.active {
      display: block;
    }
    
    .form-footer {
      text-align: center;
      margin-top: var(--spacing-lg);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--gray-200);
    }
    
    .form-footer a {
      color: var(--primary-color);
      text-decoration: none;
    }
    
    .form-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>📚 SLMS</h1>
        <p class="text-muted">Smart Library Management System</p>
      </div>
      
      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('login')">Login</button>
        <button class="login-tab" onclick="switchTab('register')">Register</button>
      </div>
      
      <!-- Login Form -->
      <form id="loginForm" class="login-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginUsername" class="form-label">Username</label>
          <input type="text" id="loginUsername" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-md);">
          Login
        </button>
      </form>
      
      <!-- Register Form -->
      <form id="registerForm" class="login-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="registerUsername" class="form-label">Username</label>
          <input type="text" id="registerUsername" class="form-control" required minlength="3" maxlength="50">
        </div>
        
        <div class="form-group">
          <label for="registerEmail" class="form-label">Email</label>
          <input type="email" id="registerEmail" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="registerPassword" class="form-label">Password</label>
          <input type="password" id="registerPassword" class="form-control" required minlength="6">
        </div>
        
        <div class="form-group">
          <label for="registerRole" class="form-label">Role</label>
          <select id="registerRole" class="form-control" required>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-md);">
          Register
        </button>
      </form>
      
      <div class="form-footer">
        <p class="text-muted" style="font-size: 0.9rem; margin-top: var(--spacing-md); text-align: center;">
          <strong>Note:</strong> Students access the user portal. Admins access the librarian portal.
        </p>
      </div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
